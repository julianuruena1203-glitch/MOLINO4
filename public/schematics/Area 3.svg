<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%" style="background:#ffffff; font-family:'Plus Jakarta Sans', Arial, sans-serif;">
  <defs>
    <style>
      .cyl-num { font-size: 28px; font-weight: 500; fill: #111827; text-anchor: middle; dominant-baseline: central; }
      .roll-num { font-size: 11px; font-weight: 600; fill: #111827; text-anchor: middle; }
      .roll-letter { font-size: 10px; font-weight: 600; fill: #111827; text-anchor: middle; }
      .pinion-text { font-size: 13px; font-weight: 700; fill: #111827; text-anchor: middle; dominant-baseline: central; }
      .sec-title { font-size: 20px; font-weight: 400; fill: #111827; letter-spacing: 4px; font-family: monospace, sans-serif; }
    </style>
  </defs>

  <!-- Dashed felt line (cyan) -->
  <polyline points="90,285 110,230 140,140 160,200 200,270 330,80 530,110 740,185 820,290" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-dasharray="4 3" />

  <!-- Continuous paper line weaving through cylinders (Golden brown) -->
  <path d="M 40,310 L 95,305 C 120,305 130,225 195,225 C 255,225 250,370 310,370 C 370,370 365,225 425,225 C 485,225 480,370 540,370 C 600,370 595,225 655,225 C 715,225 710,370 770,370 C 830,370 825,225 870,225 L 910,370" fill="none" stroke="#b38827" stroke-width="2.4" />

  <!-- Top rolls -->
  <!-- 82 B -->
  <g transform="translate(110, 230)"><circle cx="0" cy="0" r="9" fill="#fff" stroke="#ea580c" stroke-width="1.5" /><text x="-18" y="-3" class="roll-num">82</text><text x="-18" y="7" class="roll-letter">B</text></g>
  <!-- 83 B -->
  <g transform="translate(140, 140)"><circle cx="0" cy="0" r="9" fill="#fff" stroke="#ea580c" stroke-width="1.5" /><text x="0" y="-18" class="roll-num">83</text><text x="0" y="-8" class="roll-letter">B</text></g>
  <!-- 85 B -->
  <g transform="translate(200, 185)"><circle cx="0" cy="0" r="9" fill="#fff" stroke="#ea580c" stroke-width="1.5" /><text x="0" y="-18" class="roll-num">85</text><text x="0" y="-8" class="roll-letter">B</text></g>
  <!-- 84 H -->
  <g transform="translate(330, 80)"><circle cx="0" cy="0" r="9" fill="#fff" stroke="#ea580c" stroke-width="1.5" /><text x="0" y="-18" class="roll-num">84</text><text x="0" y="-8" class="roll-letter">H</text></g>
  <!-- 86 K -->
  <g transform="translate(530, 110)"><circle cx="0" cy="0" r="9" fill="#fff" stroke="#ea580c" stroke-width="1.5" /><text x="0" y="-18" class="roll-num">86</text><text x="0" y="-8" class="roll-letter">K</text></g>
  <!-- 87 J -->
  <g transform="translate(740, 185)"><circle cx="0" cy="0" r="9" fill="#fff" stroke="#ea580c" stroke-width="1.5" /><text x="0" y="-18" class="roll-num">87</text><text x="0" y="-8" class="roll-letter">J</text></g>

  <!-- Pocket rolls Cuarta -->
  <!-- 81 B -->
  <g transform="translate(285, 260)"><circle cx="0" cy="0" r="9" fill="#fff" stroke="#ea580c" stroke-width="1.5" /><text x="0" y="-18" class="roll-num">81</text><text x="0" y="-8" class="roll-letter">B</text></g>
  <!-- 80 B -->
  <g transform="translate(460, 260)"><circle cx="0" cy="0" r="9" fill="#fff" stroke="#ea580c" stroke-width="1.5" /><text x="0" y="-18" class="roll-num">80</text><text x="0" y="-8" class="roll-letter">B</text></g>
  <!-- 79 B -->
  <g transform="translate(630, 260)"><circle cx="0" cy="0" r="9" fill="#fff" stroke="#ea580c" stroke-width="1.5" /><text x="0" y="-18" class="roll-num">79</text><text x="0" y="-8" class="roll-letter">B</text></g>
  <!-- 78 B -->
  <g transform="translate(810, 265)"><circle cx="0" cy="0" r="9" fill="#fff" stroke="#ea580c" stroke-width="1.5" /><text x="0" y="-18" class="roll-num">78</text><text x="0" y="-8" class="roll-letter">B</text></g>

  <!-- Exit Roll 89 M -->
  <g transform="translate(88, 320)"><circle cx="0" cy="0" r="9" fill="#fff" stroke="#ea580c" stroke-width="1.5" /><text x="0" y="20" class="roll-num">89</text><text x="0" y="30" class="roll-letter">M</text></g>

  <!-- Bottom rolls Cuarta -->
  <!-- 72 E -->
  <g transform="translate(195, 375)"><circle cx="0" cy="0" r="9" fill="#fff" stroke="#ea580c" stroke-width="1.5" /><text x="-18" y="-3" class="roll-num">72</text><text x="-18" y="7" class="roll-letter">E</text></g>
  <!-- 71 C -->
  <g transform="translate(372, 330)"><circle cx="0" cy="0" r="9" fill="#fff" stroke="#ea580c" stroke-width="1.5" /><text x="0" y="20" class="roll-num">71</text><text x="0" y="30" class="roll-letter">C</text></g>
  <!-- 70 C -->
  <g transform="translate(545, 330)"><circle cx="0" cy="0" r="9" fill="#fff" stroke="#ea580c" stroke-width="1.5" /><text x="0" y="20" class="roll-num">70</text><text x="0" y="30" class="roll-letter">C</text></g>
  <!-- 69 C -->
  <g transform="translate(720, 330)"><circle cx="0" cy="0" r="9" fill="#fff" stroke="#ea580c" stroke-width="1.5" /><text x="0" y="20" class="roll-num">69</text><text x="0" y="30" class="roll-letter">C</text></g>
  <!-- 68 D -->
  <g transform="translate(915, 340)"><circle cx="0" cy="0" r="9" fill="#fff" stroke="#ea580c" stroke-width="1.5" /><text x="0" y="20" class="roll-num">68</text><text x="0" y="30" class="roll-letter">D</text></g>

  <!-- Cylinders Upper (38, 36, 34, 32) -->
  <circle cx="195" cy="240" r="56" fill="none" stroke="#b38827" stroke-width="2.4" /><text x="195" y="240" class="cyl-num">38</text>
  <circle cx="372" cy="240" r="56" fill="none" stroke="#b38827" stroke-width="2.4" /><text x="372" y="240" class="cyl-num">36</text>
  <circle cx="545" cy="240" r="56" fill="none" stroke="#b38827" stroke-width="2.4" /><text x="545" y="240" class="cyl-num">34</text>
  <circle cx="720" cy="240" r="56" fill="none" stroke="#b38827" stroke-width="2.4" /><text x="720" y="240" class="cyl-num">32</text>

  <!-- Cylinders Lower (37, 35, 33, 31) -->
  <circle cx="285" cy="370" r="56" fill="none" stroke="#b38827" stroke-width="2.4" /><text x="285" y="370" class="cyl-num">37</text>
  <circle cx="460" cy="370" r="56" fill="none" stroke="#b38827" stroke-width="2.4" /><text x="460" y="370" class="cyl-num">35</text>
  <circle cx="630" cy="370" r="56" fill="none" stroke="#b38827" stroke-width="2.4" /><text x="630" y="370" class="cyl-num">33</text>
  <circle cx="805" cy="370" r="56" fill="none" stroke="#b38827" stroke-width="2.4" /><text x="805" y="370" class="cyl-num">31</text>

  <!-- Pinions Cuarta: XVI, P, XV, O, XIV, N -->
  <!-- XVI & P -->
  <circle cx="232" cy="295" r="13" fill="#fff" stroke="#111827" stroke-width="2" /><text x="232" y="295" class="pinion-text">XVI</text>
  <circle cx="258" cy="325" r="13" fill="#fff" stroke="#111827" stroke-width="2" /><text x="258" y="325" class="pinion-text">P</text>
  <!-- XV & O -->
  <circle cx="346" cy="295" r="13" fill="#fff" stroke="#111827" stroke-width="2" /><text x="346" y="295" class="pinion-text">XV</text>
  <circle cx="326" cy="325" r="13" fill="#fff" stroke="#111827" stroke-width="2" /><text x="326" y="325" class="pinion-text">O</text>
  <!-- XIV & N -->
  <circle cx="426" cy="295" r="13" fill="#fff" stroke="#111827" stroke-width="2" /><text x="426" y="295" class="pinion-text">XIV</text>
  <circle cx="446" cy="325" r="13" fill="#fff" stroke="#111827" stroke-width="2" /><text x="446" y="325" class="pinion-text">N</text>

  <!-- Title -->
  <text x="475" y="460" class="sec-title" text-anchor="middle">CUARTA SECCION</text>
</svg>